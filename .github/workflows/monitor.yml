name: HMV Stock Monitor Cron

on:
  schedule:
    # 国际标准时间每 10 分钟自动在云端跑一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许你在网页上随时手动点击运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 检查仓库代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装爬虫依赖库
      run: |
        pip install requests beautifulsoup4

    - name: 4. 执行监控脚本并注入安全密钥
      env:
        WX_APP_TOKEN: ${{ secrets.WX_APP_TOKEN }}
        WX_UID: ${{ secrets.WX_UID }}
      run: python monitor.py
