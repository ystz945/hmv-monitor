name: HMV Browser Simulation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        
    - name: 🚨 安装和部署真实的 Chromium 浏览器
      run: |
        python -m playwright install chromium --with-deps

    - name: 模拟真实用户运行监控
      env:
        WX_APP_TOKEN: ${{ secrets.WX_APP_TOKEN }}
        WX_UID: ${{ secrets.WX_UID }}
      run: python monitor.py
