name: HMV Browser Simulation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限以便推送计数器

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        
    - name: 安装浏览器环境
      run: |
        python -m playwright install chromium --with-deps

    - name: 运行监控脚本
      env:
        WX_APP_TOKEN: ${{ secrets.WX_APP_TOKEN }}
        WX_UID: ${{ secrets.WX_UID }}
      run: python monitor.py

    - name: 提交运行次数
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .monitor_counter.txt
        git commit -m "🤖 更新运行次数" || echo "无变更"
        git push

    - name: 上传网页快照
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hmv-debug-html
        path: downloaded_page.html
