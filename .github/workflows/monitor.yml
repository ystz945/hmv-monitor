name: HMV Stock Monitor Cron

on:
  schedule:
    - cron: '*/10 * * * *'  # 每 10 分钟运行一次
  workflow_dispatch:        # 支持手动点击运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检查仓库代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装爬虫依赖库
      run: |
        pip install requests beautifulsoup4

    - name: 4. 恢复/读取运行次数缓存
      uses: actions/cache@v4
      with:
        path: .monitor_counter.txt
        key: monitor-counter-${{ github.run_id }}-${{ github.run_number }}
        restore-keys: |
          monitor-counter-

    - name: 5. 执行监控脚本并注入安全密钥
      env:
        WX_APP_TOKEN: ${{ secrets.WX_APP_TOKEN }}
        WX_UID: ${{ secrets.WX_UID }}
      run: python monitor.py
